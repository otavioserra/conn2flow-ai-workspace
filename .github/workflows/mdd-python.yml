name: MDD Python

on:
  push:
    paths: ['tools/**', 'scripts/skills/sync-skills.cjs', '.github/workflows/mdd-python.yml']
  pull_request:
    paths: ['tools/**', 'scripts/skills/sync-skills.cjs', '.github/workflows/mdd-python.yml']

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e "tools/mdd-client[test]" -e "tools/mdd-hub[test]"
      - run: python -m ruff check tools
      - run: python -m pytest tools/mdd-client/tests tools/mdd-hub/tests tools/tests --cov=mdd_client --cov=mdd_hub --cov-fail-under=95
      - run: python tools/verify_mdd.py --output temp/mdd-smoke.json
