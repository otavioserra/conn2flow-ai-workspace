[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdd-hub"
version = "0.1.0"
description = "MDD report hub and asynchronous documentation watcher"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.46,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "PyYAML>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
mdd-hub = "mdd_hub.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
