[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdd-client"
version = "0.1.0"
description = "Local Memory Driven Development CLI and monitor"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1"]

[project.scripts]
mdd = "mdd_client.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
